<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Винный погреб | Винтаж</title>
    
    <!-- Подключаем винтажные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- БАЗА --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Твой паттерн как фон */
            background-image: url('bg.jpg'); /* <-- ЗДЕСЬ НАЗВАНИЕ ТВОЕЙ КАРТИНКИ */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #2B0A0A; /* Запасной цвет, если картинка не загрузится */
            
            font-family: 'Lora', serif;
            color: #E8D8C8; /* Цвет пергамента */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            
            /* Затемняющий слой поверх паттерна, чтобы текст читался */
            position: relative;
        }

        /* Полупрозрачная черная пленка поверх фона */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 5, 5, 0.75); /* Чем больше число, тем темнее */
            z-index: -1;
        }

        /* --- КОНТЕНТ --- */
        .container {
            max-width: 800px;
            padding: 40px;
            border: 1px solid rgba(184, 134, 11, 0.3); /* Тонкая золотая рамка */
            position: relative;
        }

        /* Двойная рамка (винтажный прием) */
        .container::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid rgba(184, 134, 11, 0.15);
            pointer-events: none;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            font-weight: 700;
            color: #D4AF37; /* Золото */
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-style: italic;
            color: #C5A059;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: #B8860B;
            margin: 0 auto 30px auto;
            position: relative;
        }

        /* Ромбик на разделителе */
        .divider::after {
            content: '♦';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: #B8860B;
            font-size: 1.2rem;
            background: transparent;
            padding: 0 5px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #D4C4B0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- КНОПКА --- */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid #B8860B;
            color: #D4AF37;
            text-decoration: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            background: transparent;
            cursor: pointer;
        }

        .btn:hover {
            background: #B8860B;
            color: #1A0505;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.4);
        }

        /* --- АДАПТИВ --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .container {
                padding: 20px;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Винный погреб</h1>
        <div class="subtitle">Искусство, проверенное временем</div>
        
        <div class="divider"></div>

        <p>
            Добро пожаловать в наше хранилище. Здесь, в прохладной тишине подземелья, 
            рождаются легенды. Мы бережно храним традиции виноделия с 1892 года.
        </p>

        <a href="#" class="btn">Открыть коллекцию</a>
    </div>

</body>
</html>
